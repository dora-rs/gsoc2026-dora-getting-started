[project]
name = "dora-octos-process-supervision"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "dora-rs==0.5.0",
  "fastapi==0.140.13",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "pyarrow>=14,<20",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "uvicorn==0.51.0"
]

[project.optional-dependencies]
test = [
  "pytest>=7,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
