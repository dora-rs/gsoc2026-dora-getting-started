nodes:
  - id: gateway
    path: runtime_bridge/sidecar_node.py
    inputs:
      tick: dora/timer/millis/50
      state: state/state
      command_result: command/result
      observation_result: observation/result
      activity_result: activity/result
    outputs:
      - command_request
      - observation_request
      - activity_request
    env:
      DORA_WORKER_SCRIPT: /workspace/dora/process_gateway_node.py
      DORA_WORKER_CWD: /workspace/dora
      DORA_WORKER_PYTHON: /usr/bin/python3
      DORA_WORKER_PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages

  - id: state
    path: runtime_bridge/sidecar_node.py
    inputs:
      tick: dora/timer/millis/100
    outputs:
      - state
    env:
      DORA_WORKER_SCRIPT: /workspace/dora/process_state_node.py
      DORA_WORKER_CWD: /workspace/dora
      DORA_WORKER_PYTHON: /usr/bin/python3
      DORA_WORKER_PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages

  - id: command
    path: runtime_bridge/sidecar_node.py
    inputs:
      action: gateway/command_request
    outputs:
      - result
    env:
      DORA_WORKER_SCRIPT: /workspace/dora/process_command_node.py
      DORA_WORKER_CWD: /workspace/dora
      DORA_WORKER_PYTHON: /usr/bin/python3
      DORA_WORKER_PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages

  - id: observation
    path: runtime_bridge/sidecar_node.py
    inputs:
      observe: gateway/observation_request
    outputs:
      - result
    env:
      DORA_WORKER_SCRIPT: /workspace/dora/process_observation_node.py
      DORA_WORKER_CWD: /workspace/dora
      DORA_WORKER_PYTHON: /usr/bin/python3
      DORA_WORKER_PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages

  - id: activity
    path: runtime_bridge/sidecar_node.py
    inputs:
      activity: gateway/activity_request
    outputs:
      - result
    env:
      DORA_WORKER_SCRIPT: /workspace/dora/process_activity_node.py
      DORA_WORKER_CWD: /workspace/dora
      DORA_WORKER_PYTHON: /usr/bin/python3
      DORA_WORKER_PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages
