nodes:
  - id: gateway
    path: week11_gateway_node.py
    inputs:
      tick: dora/timer/millis/50
      state: state/state
      command_result: command/result
      observation_result: observation/result
      activity_result: activity/result
    outputs:
      - command_request
      - observation_request
      - activity_request
    env:
      PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages
      LD_LIBRARY_PATH: /opt/ros/humble/lib/x86_64-linux-gnu:/opt/ros/humble/lib
      AMENT_PREFIX_PATH: /opt/ros/humble
      ROS_VERSION: "2"
      ROS_PYTHON_VERSION: "3"
      ROS_DISTRO: humble

  - id: state
    path: week11_state_node.py
    inputs:
      tick: dora/timer/millis/100
    outputs:
      - state
    env:
      PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages
      LD_LIBRARY_PATH: /opt/ros/humble/lib/x86_64-linux-gnu:/opt/ros/humble/lib
      AMENT_PREFIX_PATH: /opt/ros/humble
      ROS_VERSION: "2"
      ROS_PYTHON_VERSION: "3"
      ROS_DISTRO: humble

  - id: command
    path: week11_command_node.py
    inputs:
      action: gateway/command_request
    outputs:
      - result
    env:
      PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages
      LD_LIBRARY_PATH: /opt/ros/humble/lib/x86_64-linux-gnu:/opt/ros/humble/lib
      AMENT_PREFIX_PATH: /opt/ros/humble
      ROS_VERSION: "2"
      ROS_PYTHON_VERSION: "3"
      ROS_DISTRO: humble

  - id: observation
    path: week11_observation_node.py
    inputs:
      observe: gateway/observation_request
    outputs:
      - result
    env:
      PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages
      LD_LIBRARY_PATH: /opt/ros/humble/lib/x86_64-linux-gnu:/opt/ros/humble/lib
      AMENT_PREFIX_PATH: /opt/ros/humble
      ROS_VERSION: "2"
      ROS_PYTHON_VERSION: "3"
      ROS_DISTRO: humble

  - id: activity
    path: week11_activity_node.py
    inputs:
      activity: gateway/activity_request
    outputs:
      - result
    env:
      PYTHONPATH: /workspace:/workspace/dora:/opt/ros/humble/lib/python3.10/site-packages:/opt/ros/humble/local/lib/python3.10/dist-packages
      LD_LIBRARY_PATH: /opt/ros/humble/lib/x86_64-linux-gnu:/opt/ros/humble/lib
      AMENT_PREFIX_PATH: /opt/ros/humble
      ROS_VERSION: "2"
      ROS_PYTHON_VERSION: "3"
      ROS_DISTRO: humble
