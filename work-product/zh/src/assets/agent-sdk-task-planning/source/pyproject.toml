[project]
name = "dora-agent-sdk-task-planning"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai-agents==0.19.0",
  "pydantic>=2.10,<3",
  "pyarrow>=14,<20",
  "uvicorn>=0.34,<1"
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
